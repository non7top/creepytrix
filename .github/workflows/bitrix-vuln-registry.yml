name: Bitrix vuln registry

# Weekly sync of the 1C-Bitrix third-party vulnerability registry
# (https://www.1c-bitrix.ru/vul_dev/rss/). Regenerates the committed snapshot
# and the module->fixed-version JSON; opens a PR only when something changed.

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync registry from vul_dev RSS
        run: python3 scripts/update_vuln_registry.py

      - name: Open PR if the registry changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/bitrix-vuln-registry
          commit-message: 'chore: sync Bitrix vuln-module registry from vul_dev RSS'
          title: 'Sync Bitrix vuln-module registry (vul_dev RSS)'
          body: |
            Automated weekly sync of the 1C-Bitrix third-party vulnerability
            registry: https://www.1c-bitrix.ru/vul_dev/rss/

            Review the diff in:
            - `data/vul_dev_rss.xml` (raw snapshot for comparison)
            - `data/bitrix_vuln_modules.json` (parsed module -> fixed version;
              also merges the curated `data/bitrix_vuln_modules_manual.json`)

            New or changed rows mean new vulnerable marketplace modules to detect
            in local mode. If empty, no changes were found this week.

            ⚠️ **Check the "Sync registry" step's run summary / annotations.**
            The grid lists some modules WITHOUT a marketplace link (unpublished /
            withdrawn — "снято с публикации"); those carry no module code and
            can't be scraped. If the sync reports an *unmatched* row, add its
            slug to `data/bitrix_vuln_modules_manual.json` and push to this
            branch so the module is detected in local mode.
          add-paths: |
            data/vul_dev_rss.xml
            data/bitrix_vuln_modules.json
          delete-branch: true
